<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        var path = window.location.pathname;
        if (path.includes('/iZeroPDF/')) {
            window.location.replace('/iZeroPDF/');
        } else {
            window.location.replace('/');
        }
    </script>
</head>
<body>
    <p>Redirecting to <a href="./">iZeroPDF</a>...</p>
</body>
</html>
